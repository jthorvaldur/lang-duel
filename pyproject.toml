[project]
name = "lang-duel"
version = "0.1.0"
description = "Adaptive English/Spanish terminal trainer that weights questions toward your weaker language, expands every verb, and traces word lineage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
langduel = "langduel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langduel"]

[tool.ruff]
line-length = 100
src = ["src"]
